services:
  # Combined full-stack service — uses the root Dockerfile which builds frontend
  # and serves it from FastAPI (same origin, no CORS issues)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""   # Empty = same-origin relative API calls
    env_file: .env
    environment:
      APP_ENV: production
      ALLOWED_ORIGINS: "http://localhost:8000,http://localhost:5173,http://localhost:5174"
      ANALYSIS_DB_PATH: /app/data/navi360.db
      EXPOSE_DOCS: "false"
    volumes:
      - navi_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  navi_data:
