services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:8000
      ANALYSIS_DB_PATH: /app/data/navi360.db
      EXPOSE_DOCS: "false"
    volumes:
      - navi_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  navi_data:
